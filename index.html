            const lines = text.trim().split(/\r?\n/);

            const parseRow = (line) => {
                const vals = [];
                let cur = '', inQ = false;
                for (let i = 0; i < line.length; i++) {
                    if (line[i] === '"') { inQ = !inQ; }
                    else if (line[i] === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
                    else { cur += line[i]; }
                }
                vals.push(cur.trim());
                return vals;
            };
            const headers = parseRow(lines[0]);

                const vals = parseRow(line);
                const obj = {};

        // Hooks
        const { useState, useEffect, useMemo } = React;

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [view, setView] = useState('quote'); // 'quote' | 'admin' | 'stock'
            const [sheetsStatus, setSheetsStatus] = useState('idle'); // 'idle' | 'loading' | 'ok' | 'error'

            // Inicializar desde localStorage (como caché)
            const [maizePrices, setMaizePrices] = useState(() => {
                const s = localStorage.getItem('grain_maize');
                return s ? JSON.parse(s) : INITIAL_MZ;
            });
            const [sunflowerPrices, setSunflowerPrices] = useState(() => {
                const s = localStorage.getItem('grain_sunflower');
                return s ? JSON.parse(s) : INITIAL_GS;
            });
            const [stockData, setStockData] = useState(() => {
                const s = localStorage.getItem('grain_stock');
                return s ? JSON.parse(s) : INITIAL_STOCK;
            });

            // Cargar desde Google Sheets al montar
            useEffect(() => {
                const fetchSheets = async () => {
                    setSheetsStatus('loading');
                    try {
                        const [resMz, resGs, resStock] = await Promise.all([
                            fetch(SHEETS_BASE + 'Maiz'),
                            fetch(SHEETS_BASE + 'Girasol'),
                            fetch(SHEETS_BASE + 'Stock')
                        ]);

                        if (!resMz.ok || !resGs.ok || !resStock.ok) throw new Error('HTTP error');

                        const [txtMz, txtGs, txtStock] = await Promise.all([
                            resMz.text(), resGs.text(), resStock.text()
                        ]);

                        const mz = parseCSV(txtMz).map(r => ({ id: r.id, price: parseFloat(r.price) || 0 }));
                        const gs = parseCSV(txtGs).map(r => ({ id: r.id, price: parseFloat(r.price) || 0 }));
                        const stock = parseCSV(txtStock).map(r => ({
                            id: parseInt(r.id) || Date.now(),
                            cat: r.cat || '',
                            name: r.name || '',
                            price: parseFloat(r.price) || 0,
                            expiry: r.expiry || '',
                            notes: r.notes || '',
                            qty: parseFloat(r.qty) || 0
                        }));

                        if (mz.length > 0) { setMaizePrices(mz); localStorage.setItem('grain_maize', JSON.stringify(mz)); }
                        if (gs.length > 0) { setSunflowerPrices(gs); localStorage.setItem('grain_sunflower', JSON.stringify(gs)); }
                        if (stock.length > 0) { setStockData(stock); localStorage.setItem('grain_stock', JSON.stringify(stock)); }

                        setSheetsStatus('ok');
                    } catch (err) {
                        console.warn('Google Sheets no disponible, usando caché local:', err);
                        setSheetsStatus('error');
                    }
                };
                fetchSheets();
            }, []);

            // Guardar precios a localStorage (panel Admin)
            const savePrices = (mz, gs) => {
                localStorage.setItem('grain_maize', JSON.stringify(mz));
                localStorage.setItem('grain_sunflower', JSON.stringify(gs));
                setMaizePrices(mz);
                setSunflowerPrices(gs);
                alert("Precios guardados con éxito.");
            };

            const styles = {
                header: { backgroundColor: '#0f4d22', padding: '15px 30px', color: '#d4af37', display: 'flex', justifyContent: 'space-between', alignItems: 'center' },
                title: { margin: 0, fontSize: '24px', fontWeight: 'bold' },
                navBtn: { backgroundColor: 'transparent', color: '#d4af37', border: '1px solid #d4af37', padding: '8px 15px', borderRadius: '4px', cursor: 'pointer', margin: '0 5px' },
                activeNavBtn: { backgroundColor: '#d4af37', color: '#0f4d22', border: '1px solid #d4af37', padding: '8px 15px', borderRadius: '4px', cursor: 'pointer', margin: '0 5px', fontWeight: 'bold' }
            };

            const statusBadge = {
                loading: { text: '⏳ Sincronizando con Sheets...', color: '#856404', bg: '#fff3cd' },
                ok:      { text: '✅ Datos actualizados desde Google Sheets', color: '#155724', bg: '#d4edda' },
                error:   { text: '⚠️ Sin conexión a Sheets — usando datos locales', color: '#721c24', bg: '#f8d7da' },
            }[sheetsStatus];

            return (
                <div>
                    <div style={styles.header}>
                        <h1 style={styles.title}>GRAIN - Semillas NK</h1>
                        <div>
                            <button style={view === 'quote' ? styles.activeNavBtn : styles.navBtn} onClick={() => setView('quote')}>Cotizador</button>
                            <button style={view === 'admin' ? styles.activeNavBtn : styles.navBtn} onClick={() => setView('admin')}>Administrar Precios</button>
                            <button style={view === 'stock' ? styles.activeNavBtn : styles.navBtn} onClick={() => setView('stock')}>📦 Stock</button>
                        </div>
                    </div>
                    {statusBadge && (
                        <div style={{ background: statusBadge.bg, color: statusBadge.color, textAlign: 'center', padding: '6px', fontSize: '13px', fontWeight: '500' }}>
                            {statusBadge.text}
                        </div>
                    )}

        // --- COMPONENTE GENERADOR ---
        function QuoteGenerator({ maizePrices, sunflowerPrices, stockData }) {
            const [clientName, setClientName] = useState('');
            const [validUntil, setValidUntil] = useState('');
            const [distributor, setDistributor] = useState('Productor');
            const [preCampaign, setPreCampaign] = useState(12);
            const [empowerment, setEmpowerment] = useState(0);
            const [paymentCondition, setPaymentCondition] = useState('CDO/Tarjeta/Préstamo/Canje Disponible');
            const [rows, setRows] = useState([{ id: 1, type: 'MZ', hybrid: maizePrices[0].id, band: 'B1', quantity: 1, obs: '' }]);
            
            const [seedsComment, setSeedsComment] = useState('');
            const [insumosComment, setInsumosComment] = useState('');

            // --- AGROINSUMOS (datos vienen como prop desde App) ---
            const [selectedInsumos, setSelectedInsumos] = useState([]);
            const [insumoSearch, setInsumoSearch] = useState('');
            const [insumoQty, setInsumoQty] = useState(1);
            const [insumoSelected, setInsumoSelected] = useState('');

            const stockCategories = useMemo(() => ['Todas', ...Array.from(new Set(stockData.map(i => i.cat))).sort()], [stockData]);
            const [insumoCatFilter, setInsumoCatFilter] = useState('Todas');

            const filteredStock = useMemo(() => stockData.filter(i => {
                const matchCat = insumoCatFilter === 'Todas' || i.cat === insumoCatFilter;
                const matchSearch = insumoSearch === '' || i.name.toLowerCase().includes(insumoSearch.toLowerCase());
                return matchCat && matchSearch && i.price > 0;
            }), [stockData, insumoCatFilter, insumoSearch]);

            const addInsumo = () => {
                const product = stockData.find(i => String(i.id) === String(insumoSelected));
                if (!product) return;
                const qty = parseFloat(insumoQty) || 1;
                const exists = selectedInsumos.find(i => i.id === product.id);
                if (exists) {
                    setSelectedInsumos(selectedInsumos.map(i => i.id === product.id ? { ...i, qty: i.qty + qty } : i));
                } else {
                    setSelectedInsumos([...selectedInsumos, { ...product, qty }]);
                }
                setInsumoQty(1);
            };

            const removeInsumo = (id) => setSelectedInsumos(selectedInsumos.filter(i => i.id !== id));
            const updateInsumoQty = (id, val) => setSelectedInsumos(selectedInsumos.map(i => i.id === id ? { ...i, qty: parseFloat(val) || 0 } : i));

            const totalInsumos = selectedInsumos.reduce((acc, i) => acc + (i.qty * i.price || 0), 0);

            const getBasePrice = (type, hybridId) => {
                const arr = type === 'MZ' ? maizePrices : sunflowerPrices;
                const found = arr.find(x => x.id === hybridId);
                return found ? found.price : 0;
            };

            // Calcular precios con useMemo para evitar loops infinitos
            const calculatedRows = useMemo(() => {
                const dFactor = DISTRIBUTOR_FACTORS[distributor] || 1;
                const pCond = PAYMENT_FACTORS[paymentCondition] || 1;
                const preCamp = parseFloat(preCampaign) || 0;
                const empower = parseFloat(empowerment) || 0;

                return rows.map(row => {
                    let base = getBasePrice(row.type, row.hybrid);
                    let bandFactor = 1;
                    if (row.type === 'MZ' && MAIZE_BANDS[row.band]) bandFactor = MAIZE_BANDS[row.band];
                    if (row.type === 'GS' && SUNFLOWER_BANDS[row.band]) bandFactor = SUNFLOWER_BANDS[row.band];

                    let precioBaseAjustado = base * bandFactor;
                    let uPrice = precioBaseAjustado * (1 - preCamp / 100) * dFactor * (1 - empower / 100) * pCond;

                    return {
                        ...row,
                        unitPrice: uPrice,
                        totalPrice: uPrice * (parseFloat(row.quantity) || 0)
                    };
                });
            }, [rows, distributor, preCampaign, empowerment, paymentCondition, maizePrices, sunflowerPrices]);

            const addRow = () => {
                setRows([...rows, {
                    id: Date.now(),
                    type: 'MZ',
                    hybrid: maizePrices[0].id,
                    band: 'B1',
                    quantity: 1,
                    obs: '',
                    unitPrice: 0,
                    totalPrice: 0
                }]);
            };

            const removeRow = (id) => {
                setRows(rows.filter(r => r.id !== id));
            };

            const handleRowChange = (id, field, value) => {
                setRows(rows.map(r => {
                    if (r.id !== id) return r;
                    let newRow = { ...r, [field]: value };

                    // Si cambia de tipo MZ a GS o viceversa, acomodar valores por defecto
                    if (field === 'type') {
                        if (value === 'MZ') {
                            newRow.hybrid = maizePrices[0].id;
                            newRow.band = 'B1';
                        } else {
                            newRow.hybrid = sunflowerPrices[0].id;
                            newRow.band = 'G0-G2';
                        }
                    }
                    return newRow;
                }));
            };

            const totalGlobal = calculatedRows.reduce((acc, row) => acc + row.totalPrice, 0);

            const s = {
                container: { padding: '20px', maxWidth: '1200px', margin: '0 auto' },
                card: { backgroundColor: 'white', padding: '25px', borderRadius: '8px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)', marginBottom: '20px' },
                grid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '15px', marginBottom: '20px' },
                label: { display: 'block', fontSize: '12px', fontWeight: 'bold', color: '#666', marginBottom: '5px' },
                input: { width: '100%', padding: '10px', border: '1px solid #ccc', borderRadius: '4px', fontSize: '14px' },
                btnPrimary: { backgroundColor: '#0f4d22', color: 'white', border: 'none', padding: '12px 20px', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer', marginTop: '10px' },
                btnDanger: { backgroundColor: '#dc3545', color: 'white', border: 'none', padding: '6px 12px', borderRadius: '4px', cursor: 'pointer' },
                tableRow: { display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '10px', flexWrap: 'wrap' }
            };

            return (
                <div style={s.container}>
                    <div style={s.card}>
                        <h2 style={{ marginTop: 0, color: '#0f4d22' }}>Datos del Cliente y Condiciones</h2>
                        <div style={s.grid}>
                            <div>
                                <label style={s.label}>Cliente</label>
                                <input style={s.input} placeholder="Juan Pérez" value={clientName} onChange={e => setClientName(e.target.value)} />
                            </div>
                            <div>
                                <label style={s.label}>Tipo Distribuidor</label>
                                <select style={s.input} value={distributor} onChange={e => setDistributor(e.target.value)}>
                                    {Object.keys(DISTRIBUTOR_FACTORS).map(k => <option key={k} value={k}>{k}</option>)}
                                </select>
                            </div>
                            <div>
                                <label style={s.label}>% Precampaña</label>
                                <input type="number" style={s.input} value={preCampaign} onChange={e => setPreCampaign(e.target.value)} />
                            </div>
                            <div>
                                <label style={s.label}>% Empowerment</label>
                                <input type="number" style={s.input} value={empowerment} onChange={e => setEmpowerment(e.target.value)} />
                            </div>
                            <div>
                                <label style={s.label}>Condición de Pago</label>
                                <select style={s.input} value={paymentCondition} onChange={e => setPaymentCondition(e.target.value)}>
                                    {Object.keys(PAYMENT_FACTORS).map(k => <option key={k} value={k}>{k}</option>)}
                                </select>
                            </div>
                            <div>
                                <label style={s.label}>Vigencia</label>
                                <input style={s.input} placeholder="Ej: 30 de Abril 2026" value={validUntil} onChange={e => setValidUntil(e.target.value)} />
                            </div>
                        </div>
                    </div>

                    <div style={s.card}>
                        <h2 style={{ marginTop: 0, color: '#0f4d22' }}>Productos</h2>
                        {calculatedRows.map((row, idx) => (
                            <div key={row.id} style={{ ...s.tableRow, paddingBottom: '10px', borderBottom: idx < rows.length - 1 ? '1px solid #eee' : 'none' }}>
                                <div style={{ width: '80px' }}>
                                    <label style={s.label}>Tipo</label>
                                    <select style={s.input} value={row.type} onChange={e => handleRowChange(row.id, 'type', e.target.value)}>
                                        <option value="MZ">Maíz</option>
                                        <option value="GS">Girasol</option>
                                    </select>
                                </div>
                                <div style={{ flex: 1, minWidth: '150px' }}>
                                    <label style={s.label}>Híbrido</label>
                                    <select style={s.input} value={row.hybrid} onChange={e => handleRowChange(row.id, 'hybrid', e.target.value)}>
                                        {(row.type === 'MZ' ? maizePrices : sunflowerPrices).map(p => (
                                            <option key={p.id} value={p.id}>{p.id}</option>
                                        ))}
                                    </select>
                                </div>
                                <div style={{ width: '100px' }}>
                                    <label style={s.label}>Banda</label>
                                    <select style={s.input} value={row.band} onChange={e => handleRowChange(row.id, 'band', e.target.value)}>
                                        {Object.keys(row.type === 'MZ' ? MAIZE_BANDS : SUNFLOWER_BANDS).map(b => (
                                            <option key={b} value={b}>{b}</option>
                                        ))}
                                    </select>
                                </div>
                                <div style={{ width: '80px' }}>
                                    <label style={s.label}>Bolsas</label>
                                    <input type="number" style={s.input} value={row.quantity} onChange={e => handleRowChange(row.id, 'quantity', e.target.value)} />
                                </div>
                                <div style={{ width: '100px' }}>
                                    <label style={s.label}>U/Price</label>
                                    <div style={{ padding: '10px', fontWeight: 'bold', fontSize: '14px' }}>${row.unitPrice.toFixed(2)}</div>
                                </div>
                                <div style={{ width: '100px' }}>
                                    <label style={s.label}>Total</label>
                                    <div style={{ padding: '10px', fontWeight: 'bold', fontSize: '14px', color: '#0f4d22' }}>${row.totalPrice.toFixed(2)}</div>

                            <button

                                📄 Generar PDF Semillas

                            <label style={s.label}>Comentarios Semillas</label>

                                style={{ ...s.input, minHeight: '60px', resize: 'vertical' }}

                    {/* --- SECCIÓN AGROINSUMOS --- */}
                    <div style={s.card}>
                        <h2 style={{ marginTop: 0, color: '#0f4d22' }}>🌿 Agroinsumos</h2>

                        {/* Filtros de búsqueda */}
                        <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', marginBottom: '14px', alignItems: 'flex-end' }}>
                            <div style={{ flex: '1', minWidth: '160px' }}>
                                <label style={s.label}>Categoría</label>
                                <select style={s.input} value={insumoCatFilter} onChange={e => setInsumoCatFilter(e.target.value)}>
                                    {stockCategories.map(c => <option key={c}>{c}</option>)}

                            <div style={{ flex: '2', minWidth: '180px' }}>
                                <label style={s.label}>Buscar producto</label>
                                <input style={s.input} placeholder="Ej: Glifosato, Atrazina..." value={insumoSearch} onChange={e => setInsumoSearch(e.target.value)} />
                            </div>
                            <div style={{ flex: '2', minWidth: '200px' }}>
                                <label style={s.label}>Seleccionar ({filteredStock.length} disponibles)</label>
                                <select style={s.input} value={insumoSelected} onChange={e => setInsumoSelected(e.target.value)}>
                                    <option value="">-- Elegir producto --</option>
                                    {filteredStock.map(p => <option key={p.id} value={p.id}>{p.cat} | {p.name} — U$S {p.price.toFixed(2)}</option>)}
                                </select>
                            </div>
                            <div style={{ width: '80px' }}>
                                <label style={s.label}>Cantidad</label>
                                <input type="number" min="1" style={s.input} value={insumoQty} onChange={e => setInsumoQty(e.target.value)} />
                            </div>
                            <button onClick={addInsumo} disabled={!insumoSelected} style={{ ...s.btnPrimary, backgroundColor: '#2a7841', marginTop: '0', alignSelf: 'flex-end', opacity: insumoSelected ? 1 : 0.4 }}>+ Agregar</button>
                        </div>

                        {/* Tabla de insumos seleccionados */}
                        {selectedInsumos.length > 0 ? (
                            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                                <thead>
                                    <tr style={{ background: '#2a7841', color: 'white' }}>
                                        <th style={{ padding: '8px 10px', textAlign: 'left' }}>Categoría</th>
                                        <th style={{ padding: '8px 10px', textAlign: 'left' }}>Producto</th>
                                        <th style={{ padding: '8px 10px', textAlign: 'left' }}>Dosis/Notas</th>
                                        <th style={{ padding: '8px 10px', textAlign: 'center', width: '80px' }}>Cantidad</th>
                                        <th style={{ padding: '8px 10px', textAlign: 'right' }}>Precio Unit.</th>
                                        <th style={{ padding: '8px 10px', textAlign: 'right' }}>Subtotal</th>
                                        <th style={{ padding: '8px 10px', textAlign: 'center' }}></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {selectedInsumos.map((item, idx) => (
                                        <tr key={item.id} style={{ background: idx % 2 === 0 ? '#f6fbf7' : 'white', borderBottom: '1px solid #e0ede4' }}>
                                            <td style={{ padding: '7px 10px' }}><span style={{ background: '#e4f3e9', color: '#2a7841', padding: '2px 7px', borderRadius: '10px', fontSize: '11px', fontWeight: 'bold' }}>{item.cat}</span></td>
                                            <td style={{ padding: '7px 10px', fontWeight: '500' }}>{item.name}</td>
                                            <td style={{ padding: '7px 10px', color: '#666', fontSize: '12px' }}>{item.notes}</td>
                                            <td style={{ padding: '7px 10px', textAlign: 'center' }}>
                                                <input type="number" min="0" value={item.qty} onChange={e => updateInsumoQty(item.id, e.target.value)} style={{ width: '65px', padding: '4px 6px', border: '1px solid #ccc', borderRadius: '4px', textAlign: 'center' }} />
                                            </td>
                                            <td style={{ padding: '7px 10px', textAlign: 'right' }}>U$S {item.price.toFixed(2)}</td>
                                            <td style={{ padding: '7px 10px', textAlign: 'right', fontWeight: 'bold', color: '#2a7841' }}>U$S {(item.qty * item.price).toFixed(2)}</td>
                                            <td style={{ padding: '7px 10px', textAlign: 'center' }}>
                                                <button onClick={() => removeInsumo(item.id)} style={{ background: '#dc3545', color: 'white', border: 'none', borderRadius: '4px', padding: '3px 8px', cursor: 'pointer', fontSize: '12px' }}>✕</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : (
                            <div style={{ padding: '20px', textAlign: 'center', color: '#aaa', background: '#fafafa', borderRadius: '6px', border: '1px dashed #ddd' }}>Buscá y agregá productos para incluir en la propuesta</div>
                        )}

                        {selectedInsumos.length > 0 && (
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '15px' }}>
                                <button 
                                    onClick={() => generateInsumosPDF({ clientName, validUntil, insumosComment }, selectedInsumos)} 
                                    style={{ ...s.btnPrimary, backgroundColor: '#2a7841', marginTop: 0 }}
                                >
                                    📄 Generar PDF Insumos
                                </button>
                                <div style={{ fontWeight: 'bold', fontSize: '15px', color: '#2a7841' }}>
                                    Subtotal Agroinsumos: U$S {totalInsumos.toFixed(2)}
                                </div>
                            </div>
                        )}
                        <div style={{ marginTop: '15px' }}>
                            <label style={s.label}>Comentarios Agroinsumos</label>
                            <textarea 
                                style={{ ...s.input, minHeight: '60px', resize: 'vertical' }} 
                                placeholder="Notas adicionales para la cotización de agroinsumos..."
                                value={insumosComment}
                                onChange={e => setInsumosComment(e.target.value)}
                            />
                        </div>
                    </div>

                    {/* TOTAL GLOBAL */}
                    <div style={{ ...s.card, display: 'flex', justifyContent: 'center', alignItems: 'center', background: 'linear-gradient(135deg, #0f4d22, #1a6b30)', padding: '20px' }}>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ color: '#a0c8a8', fontSize: '13px', marginBottom: '4px' }}>Inversión Total Estimada (Semillas + Insumos)</div>
                            <div style={{ color: 'white', fontSize: '26px', fontWeight: 'bold' }}>U$S {(totalGlobal + totalInsumos).toFixed(2)}</div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE ADMINISTRADOR ---
        function PriceAdmin({ maizePrices, sunflowerPrices, onSave }) {
            const [mz, setMz] = useState(maizePrices);
            const [gs, setGs] = useState(sunflowerPrices);

            const handleMzChange = (id, newPrice) => {
                setMz(mz.map(p => p.id === id ? { ...p, price: parseFloat(newPrice) || 0 } : p));
            };

            const handleGsChange = (id, newPrice) => {
                setGs(gs.map(p => p.id === id ? { ...p, price: parseFloat(newPrice) || 0 } : p));
            };

            const s = {
                container: { padding: '20px', maxWidth: '1000px', margin: '0 auto' },
                card: { backgroundColor: 'white', padding: '25px', borderRadius: '8px', boxShadow: '0 2px 8px rgba(0,0,0,0.1)', marginBottom: '20px' },
                table: { width: '100%', borderCollapse: 'collapse', marginTop: '10px' },
                th: { backgroundColor: '#0f4d22', color: 'white', padding: '10px', textAlign: 'left' },
                td: { padding: '10px', borderBottom: '1px solid #ccc' },
                input: { width: '100px', padding: '8px', border: '1px solid #ccc', borderRadius: '4px' },
                btnPrimary: { backgroundColor: '#0f4d22', color: 'white', border: 'none', padding: '12px 20px', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer', display: 'block', margin: '20px auto' }
            };

            return (
                <div style={s.container}>
                    <div style={s.card}>
                        <h2 style={{ marginTop: 0, color: '#0f4d22' }}>Híbridos de Maíz (Base: Banda 1)</h2>
                        <table style={s.table}>
                            <thead>
                                <tr>
                                    <th style={s.th}>Híbrido</th>
                                    <th style={s.th}>Precio Base (U$S)</th>
                                    <th style={s.th}>B2 (-3%)</th>
                                    <th style={s.th}>B3 (-12%)</th>
                                    <th style={s.th}>B4 (-15%)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {mz.map(p => (
                                    <tr key={p.id}>
                                        <td style={s.td}><strong>{p.id}</strong></td>
                                        <td style={s.td}>
                                            <input type="number" style={s.input} value={p.price} onChange={e => handleMzChange(p.id, e.target.value)} />
                                        </td>
                                        <td style={s.td}>{(p.price * 0.97).toFixed(2)}</td>
                                        <td style={s.td}>{(p.price * 0.88).toFixed(2)}</td>
                                        <td style={s.td}>{(p.price * 0.85).toFixed(2)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div style={s.card}>
                        <h2 style={{ marginTop: 0, color: '#d4af37' }}>Híbridos de Girasol (Base: G0-G2)</h2>
                        <table style={s.table}>
                            <thead>
                                <tr>
                                    <th style={{ ...s.th, backgroundColor: '#d4af37', color: '#000' }}>Híbrido</th>
                                    <th style={{ ...s.th, backgroundColor: '#d4af37', color: '#000' }}>Precio Base (U$S)</th>
                                    <th style={{ ...s.th, backgroundColor: '#d4af37', color: '#000' }}>G3 (-3%)</th>
                                    <th style={{ ...s.th, backgroundColor: '#d4af37', color: '#000' }}>G4 (-20%)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {gs.map(p => (
                                    <tr key={p.id}>
                                        <td style={s.td}><strong>{p.id}</strong></td>
                                        <td style={s.td}>
                                            <input type="number" style={s.input} value={p.price} onChange={e => handleGsChange(p.id, e.target.value)} />
                                        </td>
                                        <td style={s.td}>{(p.price * 0.97).toFixed(2)}</td>
                                        <td style={s.td}>{(p.price * 0.80).toFixed(2)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <button style={s.btnPrimary} onClick={() => onSave(mz, gs)}>💾 Guardar Precios</button>
                </div>
            );
        }

        // --- COMPONENTE STOCK MANAGER ---
        function StockManager({ stockData, setStockData }) {
            const [items, setItems] = useState(stockData || INITIAL_STOCK);
            const [search, setSearch] = useState('');
            const [filterCat, setFilterCat] = useState('Todas');
            const [filterExpiry, setFilterExpiry] = useState('Todos');
            const [editingId, setEditingId] = useState(null);
            const [editBuf, setEditBuf] = useState({});
            const [showAddForm, setShowAddForm] = useState(false);
            const [newItem, setNewItem] = useState({cat:'Herbicida',name:'',price:'',expiry:'',notes:'',qty:0});

            const categories = useMemo(() => ['Todas', ...Array.from(new Set(items.map(i => i.cat))).sort()], [items]);

            const save = (updated) => {
                setItems(updated);
                localStorage.setItem('grain_stock', JSON.stringify(updated));
                if (setStockData) setStockData(updated);
            };

            const filtered = useMemo(() => items.filter(i => {
                const matchCat = filterCat === 'Todas' || i.cat === filterCat;
                const matchSearch = i.name.toLowerCase().includes(search.toLowerCase()) || i.cat.toLowerCase().includes(search.toLowerCase());
                const matchExp = filterExpiry === 'Todos' ||
                    (filterExpiry === 'Vencidos' && getExpiryStatus(i.expiry) === 'expired') ||
                    (filterExpiry === 'Por vencer' && getExpiryStatus(i.expiry) === 'soon') ||
                    (filterExpiry === 'Vigentes' && getExpiryStatus(i.expiry) === 'ok') ||
                    (filterExpiry === 'Sin fecha' && !i.expiry);
                return matchCat && matchSearch && matchExp;
            }), [items, filterCat, search, filterExpiry]);

            const startEdit = (item) => { setEditingId(item.id); setEditBuf({price: item.price, expiry: item.expiry, notes: item.notes, qty: item.qty}); };
            const cancelEdit = () => setEditingId(null);
            const confirmEdit = (id) => {
                const updated = items.map(i => i.id === id ? {...i, price: parseFloat(editBuf.price)||0, expiry: editBuf.expiry, notes: editBuf.notes, qty: parseFloat(editBuf.qty)||0} : i);
                save(updated); setEditingId(null);
            };
            const deleteItem = (id) => { if(confirm('¿Eliminar producto?')) save(items.filter(i => i.id !== id)); };
            const addItem = () => {
                if(!newItem.name.trim()) return alert('Ingresá un nombre');
                const added = [...items, {...newItem, id: Date.now(), price: parseFloat(newItem.price)||0, qty: parseFloat(newItem.qty)||0}];
                save(added); setNewItem({cat:'Herbicida',name:'',price:'',expiry:'',notes:'',qty:0}); setShowAddForm(false);
            };
            const resetStock = () => {
                if(confirm('¿Restaurar stock inicial? Se perderán todos los cambios.')) save(INITIAL_STOCK);
            };

            const statusColor = { expired:'#dc3545', soon:'#fd7e14', ok:'#198754', none:'#6c757d' };
            const statusLabel = { expired:'VENCIDO', soon:'Por vencer', ok:'Vigente', none:'Sin fecha' };

            const inp = { padding:'6px 8px', border:'1px solid #ccc', borderRadius:'4px', fontSize:'13px', width:'100%' };
            const counts = { expired: items.filter(i=>getExpiryStatus(i.expiry)==='expired').length, soon: items.filter(i=>getExpiryStatus(i.expiry)==='soon').length };

            return (
                <div style={{padding:'20px', maxWidth:'1400px', margin:'0 auto'}}>
                    {/* Resumen */}
                    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))', gap:'12px', marginBottom:'20px'}}>
                        {[
                            {label:'Total Productos', val: items.length, color:'#0f4d22'},
                            {label:'Vencidos', val: counts.expired, color:'#dc3545'},
                            {label:'Por vencer (90d)', val: counts.soon, color:'#fd7e14'},
                            {label:'Categorías', val: categories.length - 1, color:'#0d6efd'}
                        ].map(c => (
                            <div key={c.label} style={{background:'white', borderRadius:'8px', padding:'16px', boxShadow:'0 2px 6px rgba(0,0,0,0.08)', borderLeft:`4px solid ${c.color}`}}>
                                <div style={{fontSize:'28px', fontWeight:'bold', color:c.color}}>{c.val}</div>
                                <div style={{fontSize:'12px', color:'#666', marginTop:'4px'}}>{c.label}</div>
                            </div>
                        ))}
                    </div>

                    {/* Filtros */}
                    <div style={{background:'white', borderRadius:'8px', padding:'16px', boxShadow:'0 2px 6px rgba(0,0,0,0.08)', marginBottom:'20px', display:'flex', gap:'12px', flexWrap:'wrap', alignItems:'center'}}>
                        <input style={{...inp, flex:'2', minWidth:'180px'}} placeholder="🔍 Buscar producto..." value={search} onChange={e=>setSearch(e.target.value)} />
                        <select style={{...inp, flex:'1', minWidth:'160px'}} value={filterCat} onChange={e=>setFilterCat(e.target.value)}>
                            {categories.map(c=><option key={c}>{c}</option>)}
                        </select>
                        <select style={{...inp, flex:'1', minWidth:'140px'}} value={filterExpiry} onChange={e=>setFilterExpiry(e.target.value)}>
                            {['Todos','Vigentes','Por vencer','Vencidos','Sin fecha'].map(o=><option key={o}>{o}</option>)}
                        </select>
                        <button onClick={()=>setShowAddForm(!showAddForm)} style={{padding:'8px 16px', background:'#0f4d22', color:'white', border:'none', borderRadius:'4px', cursor:'pointer', fontWeight:'bold', whiteSpace:'nowrap'}}>+ Agregar</button>
                        <button onClick={resetStock} style={{padding:'8px 12px', background:'#6c757d', color:'white', border:'none', borderRadius:'4px', cursor:'pointer', fontSize:'12px'}}>↩ Restaurar</button>
                    </div>

                    {/* Formulario nuevo producto */}
                    {showAddForm && (
                        <div style={{background:'white', borderRadius:'8px', padding:'20px', boxShadow:'0 2px 6px rgba(0,0,0,0.1)', marginBottom:'20px', borderLeft:'4px solid #0f4d22'}}>
                            <h3 style={{margin:'0 0 15px', color:'#0f4d22'}}>Nuevo Producto</h3>
                            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))', gap:'12px'}}>
                                <div><label style={{fontSize:'11px', color:'#666', fontWeight:'bold', display:'block', marginBottom:'4px'}}>CATEGORÍA</label>
                                    <select style={inp} value={newItem.cat} onChange={e=>setNewItem({...newItem,cat:e.target.value})}>
                                        {categories.filter(c=>c!=='Todas').map(c=><option key={c}>{c}</option>)}
                                        <option value="Otra">Otra</option>
                                    </select></div>
                                <div style={{gridColumn:'span 2'}}><label style={{fontSize:'11px', color:'#666', fontWeight:'bold', display:'block', marginBottom:'4px'}}>NOMBRE</label>
                                    <input style={inp} value={newItem.name} onChange={e=>setNewItem({...newItem,name:e.target.value})} placeholder="Nombre del producto" /></div>
                                <div><label style={{fontSize:'11px', color:'#666', fontWeight:'bold', display:'block', marginBottom:'4px'}}>PRECIO (U$S)</label>
                                    <input type="number" style={inp} value={newItem.price} onChange={e=>setNewItem({...newItem,price:e.target.value})} /></div>
                                <div><label style={{fontSize:'11px', color:'#666', fontWeight:'bold', display:'block', marginBottom:'4px'}}>VENCIMIENTO</label>
                                    <input type="date" style={inp} value={newItem.expiry} onChange={e=>setNewItem({...newItem,expiry:e.target.value})} /></div>
                                <div><label style={{fontSize:'11px', color:'#666', fontWeight:'bold', display:'block', marginBottom:'4px'}}>CANTIDAD</label>
                                    <input type="number" style={inp} value={newItem.qty} onChange={e=>setNewItem({...newItem,qty:e.target.value})} /></div>
                                <div style={{gridColumn:'span 2'}}><label style={{fontSize:'11px', color:'#666', fontWeight:'bold', display:'block', marginBottom:'4px'}}>NOTAS</label>
                                    <input style={inp} value={newItem.notes} onChange={e=>setNewItem({...newItem,notes:e.target.value})} placeholder="Dosis, observaciones..." /></div>
                            </div>
                            <div style={{marginTop:'15px', display:'flex', gap:'10px'}}>
                                <button onClick={addItem} style={{padding:'8px 20px', background:'#0f4d22', color:'white', border:'none', borderRadius:'4px', cursor:'pointer', fontWeight:'bold'}}>Guardar</button>
                                <button onClick={()=>setShowAddForm(false)} style={{padding:'8px 20px', background:'#6c757d', color:'white', border:'none', borderRadius:'4px', cursor:'pointer'}}>Cancelar</button>
                            </div>
                        </div>
                    )}

                    {/* Tabla */}
                    <div style={{background:'white', borderRadius:'8px', boxShadow:'0 2px 6px rgba(0,0,0,0.08)', overflow:'auto'}}>
                        <div style={{padding:'12px 16px', borderBottom:'1px solid #eee', fontSize:'13px', color:'#666'}}>Mostrando {filtered.length} de {items.length} productos</div>
                        <table style={{width:'100%', borderCollapse:'collapse', fontSize:'13px'}}>
                            <thead>
                                <tr style={{background:'#0f4d22', color:'white'}}>
                                    <th style={{padding:'10px 12px', textAlign:'left'}}>Categoría</th>
                                    <th style={{padding:'10px 12px', textAlign:'left'}}>Producto</th>
                                    <th style={{padding:'10px 12px', textAlign:'right'}}>Precio U$S</th>
                                    <th style={{padding:'10px 12px', textAlign:'center'}}>Vencimiento</th>
                                    <th style={{padding:'10px 12px', textAlign:'center'}}>Stock</th>
                                    <th style={{padding:'10px 12px', textAlign:'left', minWidth:'180px'}}>Notas</th>
                                    <th style={{padding:'10px 12px', textAlign:'center'}}>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.map((item, idx) => {
                                    const st = getExpiryStatus(item.expiry);
                                    const isEditing = editingId === item.id;
                                    return (
                                        <tr key={item.id} style={{background: idx%2===0?'#fafafa':'white', borderBottom:'1px solid #eee'}}>
                                            <td style={{padding:'8px 12px'}}>
                                                <span style={{background:'#e8f4ec', color:'#0f4d22', padding:'2px 8px', borderRadius:'12px', fontSize:'11px', fontWeight:'bold', whiteSpace:'nowrap'}}>{item.cat}</span>
                                            </td>
                                            <td style={{padding:'8px 12px', fontWeight:'500'}}>{item.name}</td>
                                            <td style={{padding:'8px 12px', textAlign:'right'}}>
                                                {isEditing
                                                    ? <input type="number" style={{...inp, width:'80px'}} value={editBuf.price} onChange={e=>setEditBuf({...editBuf,price:e.target.value})} />
                                                    : item.price > 0 ? <strong>U$S {item.price.toFixed(2)}</strong> : <span style={{color:'#aaa'}}>—</span>
                                                }
                                            </td>
                                            <td style={{padding:'8px 12px', textAlign:'center'}}>
                                                {isEditing
                                                    ? <input type="date" style={{...inp, width:'140px'}} value={editBuf.expiry} onChange={e=>setEditBuf({...editBuf,expiry:e.target.value})} />
                                                    : <span style={{background: statusColor[st]+'22', color: statusColor[st], padding:'2px 8px', borderRadius:'12px', fontSize:'11px', fontWeight:'bold', whiteSpace:'nowrap'}}>
                                                        {item.expiry ? item.expiry.split('-').reverse().join('/') : '—'} {statusLabel[st] !== 'Vigente' ? '· '+statusLabel[st] : ''}
                                                      </span>
                                                }
                                            </td>
                                            <td style={{padding:'8px 12px', textAlign:'center'}}>
                                                {isEditing
                                                    ? <input type="number" style={{...inp, width:'70px'}} value={editBuf.qty} onChange={e=>setEditBuf({...editBuf,qty:e.target.value})} />
                                                    : <span style={{fontWeight:'bold', color: item.qty===0?'#aaa':'#0f4d22'}}>{item.qty}</span>
                                                }
                                            </td>
                                            <td style={{padding:'8px 12px', color:'#555'}}>
                                                {isEditing
                                                    ? <input style={{...inp}} value={editBuf.notes} onChange={e=>setEditBuf({...editBuf,notes:e.target.value})} />
                                                    : item.notes
                                                }
                                            </td>
                                            <td style={{padding:'8px 12px', textAlign:'center', whiteSpace:'nowrap'}}>
                                                {isEditing ? (
                                                    <>
                                                        <button onClick={()=>confirmEdit(item.id)} style={{padding:'4px 10px', background:'#198754', color:'white', border:'none', borderRadius:'4px', cursor:'pointer', marginRight:'4px'}}>✓</button>
                                                        <button onClick={cancelEdit} style={{padding:'4px 10px', background:'#6c757d', color:'white', border:'none', borderRadius:'4px', cursor:'pointer'}}>✕</button>
                                                    </>
                                                ) : (
                                                    <>
                                                        <button onClick={()=>startEdit(item)} style={{padding:'4px 10px', background:'#0d6efd', color:'white', border:'none', borderRadius:'4px', cursor:'pointer', marginRight:'4px'}}>✎</button>
                                                        <button onClick={()=>deleteItem(item.id)} style={{padding:'4px 10px', background:'#dc3545', color:'white', border:'none', borderRadius:'4px', cursor:'pointer'}}>🗑</button>
                                                    </>
                                                )}
                                            </td>
                                        </tr>
                                    );
                                })}
                                {filtered.length === 0 && (
                                    <tr><td colSpan="7" style={{padding:'40px', textAlign:'center', color:'#aaa'}}>No se encontraron productos</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
